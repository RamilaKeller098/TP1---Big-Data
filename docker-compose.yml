services:
  meu_flume:
    image: bigdata-flume:latest
    container_name: flume_semana1
    build: .
    volumes:
      - ./:/dados
    command: flume-ng agent -n a1 -c /opt/flume/conf -f /dados/flume.conf -Dflume.root.logger=INFO,console
    network_mode: host

  flink-jobmanager:
    build:
      context: ./flink
    image: meu-flink-python:1.18
    container_name: flink_jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./flink:/opt/flink/job
    environment:
      - JOB_MANAGER_RPC_ADDRESS=localhost
    network_mode: host

  flink-taskmanager:
    build:
      context: ./flink
    image: meu-flink-python:1.18
    container_name: flink_taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    volumes:
      - ./flink:/opt/flink/job
    environment:
      - JOB_MANAGER_RPC_ADDRESS=localhost
      - TASKMANAGER_BIND_HOST=0.0.0.0
      - TASKMANAGER_NUMBER_OF_TASK_SLOTS=2
    network_mode: host