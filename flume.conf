a1.sources = origem1
a1.sinks = destino1
a1.channels = canal1


a1.sources.origem1.type = exec
a1.sources.origem1.command = tail -F /dados/eventos.log

# Channel (Memória)
a1.channels.canal1.type = memory
a1.channels.canal1.capacity = 1000
a1.channels.canal1.transactionCapacity = 100

# Sink (HDFS)
a1.sinks.destino1.type = hdfs
a1.sinks.destino1.hdfs.path = hdfs://namenode:9000/flume/eventos/%Y%m%d
a1.sinks.destino1.hdfs.filePrefix = eventos-
a1.sinks.destino1.hdfs.fileType = DataStream
a1.sinks.destino1.hdfs.writeFormat = Text
a1.sinks.destino1.hdfs.rollInterval = 30
a1.sinks.destino1.hdfs.rollSize = 0
a1.sinks.destino1.hdfs.rollCount = 0
a1.sinks.destino1.hdfs.batchSize = 100
a1.sinks.destino1.hdfs.useLocalTimeStamp = true

a1.sources.origem1.channels = canal1
a1.sinks.destino1.channel = canal1